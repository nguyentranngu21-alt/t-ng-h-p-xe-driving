        { brand: "Robinson", name: "Robinson R22 (1979)", price: 150000, speed: 142, handling: null, acceleration: null, description: "On-Sale aircraft; 2 chỗ.", image: "https://placehold.co/600x400/000000/FF8C00?text=Robinson+R22", status: "onsale" },
        { brand: "AgustaWestland", name: "AgustaWestland A109E Power (2002)", price: 6200000, speed: 312, handling: null, acceleration: null, description: "On-Sale aircraft; 7 chỗ.", image: "https://placehold.co/600x400/000000/FF8C00?text=AgustaWestland+A109E", status: "onsale" }
    ];

    const codes = [
        { code: "RDCNASCAR25", reward: "NASCAR Toyota Camry XSE #25" },
        { code: "NASCAR100M", reward: "200 Trophies" },
        { code: "BADGUYS2", reward: "The Bad Guys 2 Betty Beater NASCAR" },
        { code: "MARCH2026", reward: "Chevrolet Camaro ZL1 (Free)" }
    ];

    // ==========================================
    // LOGIC HIỂN THỊ
    // ==========================================
    let currentBrand = "all";
    let currentSearch = "";

    // ----- FORMAT HELPERS -----
    function formatPrice(p) {
        if (p === null || p === undefined) return "Code / Pack / Event";
        if (p === 0) return "Free";
        return "$" + p.toLocaleString();
    }

    function formatSpeed(s) {
        if (s === null || s === undefined) return "—";
        const kmh = Math.round(s * 1.60934);
        return `${s} mph (${kmh} km/h)`;
    }

    function formatHandling(h) {
        if (h === null || h === undefined) return "—";
        return h + "%";
    }

    function formatAcceleration(a) {
        if (a === null || a === undefined) return "—";
        if (a === 0) return "0s";
        return a + (a < 10 ? "s" : "%");
    }

    function getStatusLabel(status) {
        if (status === 'onsale') return '<span class="status-badge status-onsale">On-Sale</span>';
        if (status === 'gamepass') return '<span class="status-badge status-gamepass">Game Pass</span>';
        if (status === 'offsale') return '<span class="status-badge status-offsale">Off-Sale</span>';
        if (status === 'event') return '<span class="status-badge status-event">Event</span>';
        if (status === 'limited') return '<span class="status-badge status-limited">Limited</span>';
        return '<span class="status-badge status-unknown">—</span>';
    }

    // ----- BRAND LIST -----
    function getBrandList() {
        const brands = [];
        const seen = new Set();
        vehicles.forEach(v => {
            if (!seen.has(v.brand)) {
                seen.add(v.brand);
                brands.push({ name: v.brand, count: vehicles.filter(x => x.brand === v.brand).length });
            }
        });
        return brands.sort((a, b) => a.name.localeCompare(b.name));
    }

    function renderBrandChips() {
        const brands = getBrandList();
        const container = document.getElementById("brandChips");
        const totalCount = vehicles.length;

        let html = `<div class="chip ${currentBrand === 'all' ? 'active' : ''}" data-brand="all">Tất cả <span class="count">${totalCount}</span></div>`;
        brands.forEach(b => {
            html += `<div class="chip ${currentBrand === b.name ? 'active' : ''}" data-brand="${b.name}">${b.name} <span class="count">${b.count}</span></div>`;
        });
        container.innerHTML = html;

        container.querySelectorAll(".chip").forEach(chip => {
            chip.addEventListener("click", () => {
                currentBrand = chip.dataset.brand;
                container.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
                chip.classList.add("active");
                document.getElementById("brandCurrent").textContent = currentBrand === "all" ? "Tất cả" : currentBrand;
                document.getElementById("brandChipsWrap").classList.remove("open");
                document.getElementById("brandToggle").classList.remove("open");
                document.getElementById("brandToggle").setAttribute("aria-expanded", "false");
                renderVehicles();
            });
        });
    }

    // ----- VEHICLES -----
    function renderVehicles() {
        const container = document.getElementById("vehiclesContainer");
        const k = currentSearch.trim().toLowerCase();
        let filtered = vehicles;

        if (currentBrand !== "all") {
            filtered = filtered.filter(v => v.brand === currentBrand);
        }
        if (k) {
            filtered = filtered.filter(v => {
                const nameMatch = v.name.toLowerCase().includes(k);
                const brandMatch = v.brand.toLowerCase().includes(k);
                const statusText = v.status === 'offsale' ? 'off-sale offsale'
                                : v.status === 'onsale' ? 'on-sale onsale'
                                : v.status === 'gamepass' ? 'gamepass game pass track pass'
                                : v.status || '';
                const statusMatch = statusText.includes(k);
                return nameMatch || brandMatch || statusMatch;
            });
        }

        if (!filtered.length) {
            container.innerHTML = '<div class="empty-state">Không tìm thấy xe hoặc hãng phù hợp.</div>';
            return;
        }

        const groups = {};
        const order = [];
        filtered.forEach(v => {
            if (!groups[v.brand]) {
                groups[v.brand] = [];
                order.push(v.brand);
            }
            groups[v.brand].push(v);
        });

        let html = "";
        order.forEach(brand => {
            const list = groups[brand];
            html += `<div class="brand-section">
                <div class="brand-title">${brand}<span class="brand-count">${list.length} xe</span></div>
                <div class="vehicle-grid">`;

            list.forEach(v => {
                const idx = vehicles.indexOf(v);
                html += `
                    <div class="vehicle-card" data-idx="${idx}">
                        <div class="vehicle-image-wrap">
                            <img class="vehicle-image" src="${v.image}" alt="${v.name}" loading="lazy">
                        </div>
                        <div class="vehicle-info">
                            ${getStatusLabel(v.status)}
                            <div class="vehicle-name">${v.name}</div>
                            <div class="vehicle-price">${formatPrice(v.price)}</div>
                            <div class="vehicle-quick-stats">
                                <span>⚡ ${formatSpeed(v.speed)}</span>
                                <span>🎯 Xử lý: ${formatHandling(v.handling)}</span>
                            </div>
                        </div>
                    </div>`;
            });

            html += `</div></div>`;
        });

        container.innerHTML = html;

        // Gắn sự kiện click bằng addEventListener (an toàn hơn onclick inline)
        container.querySelectorAll(".vehicle-card").forEach(card => {
            card.addEventListener("click", () => {
                const idx = parseInt(card.dataset.idx, 10);
                openModal(idx);
            });
        });
    }

    function renderCodes() {
        document.getElementById("codeList").innerHTML = codes.map(c => `
            <div class="code-item">
                <span class="code-name">${c.code}</span>
                <span class="code-reward">${c.reward}</span>
            </div>
        `).join("");
    }

    function renderStats() {
        const total = vehicles.length;
        const onsale = vehicles.filter(v => v.status === 'onsale').length;
        const gamepass = vehicles.filter(v => v.status === 'gamepass').length;
        const brands = new Set(vehicles.map(v => v.brand)).size;

        document.getElementById("stat-total").textContent = total;
        document.getElementById("stat-onsale").textContent = onsale;
        document.getElementById("stat-gamepass").textContent = gamepass;
        document.getElementById("stat-brands").textContent = brands;
        document.getElementById("total-badge").textContent = total + " Xe";
    }

    // ----- MODAL -----
    const overlay = document.getElementById("modalOverlay");
    const modalClose = document.getElementById("modalClose");
    const modalImage = document.getElementById("modalImage");
    const modalBrand = document.getElementById("modalBrand");
    const modalTitle = document.getElementById("modalTitle");
    const modalPrice = document.getElementById("modalPrice");
    const modalStats = document.getElementById("modalStats");
    const modalDesc = document.getElementById("modalDesc");

    function openModal(index) {
        const v = vehicles[index];
        if (!v) return;

        modalImage.src = v.image;
        modalImage.alt = v.name;
        modalBrand.textContent = v.brand;
        modalTitle.textContent = v.name;
        modalPrice.textContent = formatPrice(v.price);

        modalStats.innerHTML = `
            <div class="modal-stat"><div class="modal-stat-label">Tốc độ tối đa</div><div class="modal-stat-value">${formatSpeed(v.speed)}</div></div>
            <div class="modal-stat"><div class="modal-stat-label">Độ xử lý</div><div class="modal-stat-value">${formatHandling(v.handling)}</div></div>
            <div class="modal-stat"><div class="modal-stat-label">Tăng tốc</div><div class="modal-stat-value">${formatAcceleration(v.acceleration)}</div></div>
            <div class="modal-stat"><div class="modal-stat-label">Trạng thái</div><div class="modal-stat-value">${getStatusLabel(v.status)}</div></div>
        `;
        modalDesc.textContent = v.description || "Chưa có mô tả cho xe này.";

        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
    }

    function closeModal() {
        overlay.classList.remove("open");
        document.body.style.overflow = "";
    }

    modalClose.addEventListener("click", closeModal);
    overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    // ----- BRAND TOGGLE -----
    document.getElementById("brandToggle").addEventListener("click", () => {
        const wrap = document.getElementById("brandChipsWrap");
        const btn = document.getElementById("brandToggle");
        wrap.classList.toggle("open");
        btn.classList.toggle("open");
        btn.setAttribute("aria-expanded", wrap.classList.contains("open") ? "true" : "false");
    });

    // ----- SEARCH -----
    document.getElementById("searchInput").addEventListener("input", e => {
        currentSearch = e.target.value;
        renderVehicles();
    });

    // ----- INIT -----
    renderStats();
    renderBrandChips();
    renderVehicles();
    renderCodes();
</script>
</body>
</html>
